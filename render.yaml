# Render Blueprint: the Mira backend (FastAPI, from backend/Dockerfile) and its Postgres.
# The frontend is hosted on Vercel and forwards /api/v1/* here (see frontend/next.config.ts).
# Render > New > Blueprint > pick this repo. Values marked `sync: false` are asked for once,
# in the Render dashboard; never commit them.
services:
  - type: web
    name: mira-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mira-db
          property: connectionString
      - key: MIRA_TODAY
        value: "2026-11-19"
      - key: MIRA_COOKIE_SECURE
        value: "1"
      - key: LLM_PROVIDER
        value: gemini
      - key: FRONTEND_ORIGIN            # your Vercel address, e.g. https://mira-travel.vercel.app
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_FAST
        sync: false
      - key: GEMINI_MODEL_STRONG
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        sync: false
      - key: GEMINI_EMBEDDING_DIMS
        sync: false
      - key: MIRA_MARGIN_DAY
        sync: false
      - key: MIRA_MARGIN_MULTIDAY
        sync: false
      - key: MIRA_STAFF_EMAIL
        sync: false
      - key: MIRA_STAFF_PASSWORD
        sync: false
      - key: MIRA_APPROVER_EMAIL
        sync: false
      - key: MIRA_APPROVER_PASSWORD
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false

databases:
  - name: mira-db
    plan: free
    databaseName: mira
    user: mira
